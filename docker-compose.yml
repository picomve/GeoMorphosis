version: '3.8'

services:
  api-server:
    build:
      context: ./ai-engine
    container_name: geomorphosis-backend
    ports:
      - "8000:8000"
    volumes:
      - ./ai-engine:/app
    environment:
      - PYTHONUNBUFFERED=1

  web-client:
    build:
      context: ./frontend
    container_name: geomorphosis-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # İŞTE HAYAT KURTARAN SATIR (Veritabanı Köprüsü):
      # Ana dizindeki 'data' klasörünü, konteynırın içindeki '/app/data' klasörüne bağlıyoruz!
      - ./data:/app/data
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Prisma'ya veritabanını konteynır içinde nerede bulacağını söylüyoruz:
      - DATABASE_URL=file:/app/data/geopulse.db
    depends_on:
      - api-server

  ai-engine:
    build: ./ai-engine
    ports:
      - '8000:8000'
    environment:
      - COPERNICUS_CLIENT_ID=${COPERNICUS_CLIENT_ID}
      - COPERNICUS_CLIENT_SECRET=${COPERNICUS_CLIENT_SECRET}
      - NASA_FIRMS_API_KEY=${NASA_FIRMS_API_KEY}
    volumes:
      - ./data:/app/data
      - ./ai-engine/models:/app/models

  worker:
    build: ./worker
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - ai-engine
    volumes:
      - ./data:/app/data

volumes:
  data:
